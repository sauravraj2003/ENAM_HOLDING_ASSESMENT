<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1114">
<title>FINN</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="eyebrow" id="today"></div>
      <h1 id="title">Brief</h1>
    </div>
    <button class="icon" id="listen" title="Listen to brief" aria-label="Listen">▶</button>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button data-tab="brief" class="on"><span>◉</span>Brief</button>
    <button data-tab="ask"><span>?</span>Ask</button>
    <button data-tab="book"><span>≡</span>Holdings</button>
    <button data-tab="rules"><span>⚙</span>Rules</button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden><div class="sheet-card"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
